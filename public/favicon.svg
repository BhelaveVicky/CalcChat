<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Outer Dark Squircle Base -->
  <rect width="512" height="512" rx="115" fill="#121214" />
  
  <defs>
    <!-- Soft Gradients for 3D Calculator buttons -->
    <linearGradient id="greyBtn1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#545458" />
      <stop offset="100%" stop-color="#3a3a3c" />
    </linearGradient>
    <linearGradient id="greyBtn2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3c" />
      <stop offset="100%" stop-color="#2c2c2e" />
    </linearGradient>
    <linearGradient id="orangeBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9f0a" />
      <stop offset="100%" stop-color="#f57c00" />
    </linearGradient>
  </defs>

  <!-- Top Left Button: Light Grey '+' -->
  <circle cx="140" cy="140" r="100" fill="url(#greyBtn1)" />
  <!-- Plus Sign -->
  <path d="M 140 85 V 195 M 85 140 H 195" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />

  <!-- Top Right Button: Dark Grey '×' -->
  <circle cx="372" cy="140" r="100" fill="url(#greyBtn2)" />
  <!-- Multiply Sign -->
  <path d="M 322 90 L 422 190 M 422 90 L 322 190" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />

  <!-- Bottom Left Button: Dark Grey '-' -->
  <circle cx="140" cy="372" r="100" fill="url(#greyBtn2)" />
  <!-- Minus Sign -->
  <path d="M 90 372 H 190" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />

  <!-- Bottom Right Button: Bright Orange '=' -->
  <circle cx="372" cy="372" r="100" fill="url(#orangeBtn)" />
  <!-- Equals Sign -->
  <path d="M 322 345 H 422 M 322 399 H 422" stroke="#ffffff" stroke-width="22" stroke-linecap="round" />
</svg>
